<!DOCTYPE html>
<html>
<head>
    <title>Chat App Solidaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl flex flex-col h-[600px] border border-slate-700">
        <div class="p-4 bg-indigo-600 rounded-t-2xl font-bold text-white text-center">Chat en Tiempo Real</div>
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 text-white">
            </div>
        <div class="p-4 border-t border-slate-700 flex gap-2">
            <input id="username" type="text" placeholder="Tu nombre" class="w-24 p-2 rounded bg-slate-700 text-white outline-none">
            <input id="message" type="text" placeholder="Escribe un mensaje..." class="flex-1 p-2 rounded bg-slate-700 text-white outline-none">
            <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2 rounded text-white font-bold hover:bg-indigo-500 transition">Enviar</button>
        </div>
    </div>

    <script>
        var stompClient = null;

        function connect() {
            var socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/public', function (messageOutput) {
                    showChat(JSON.parse(messageOutput.body));
                });
            });
        }

        function sendMessage() {
            var sender = document.getElementById('username').value;
            var content = document.getElementById('message').value;
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({'sender': sender, 'content': content}));
            document.getElementById('message').value = '';
        }

        function showChat(message) {
            var chatBox = document.getElementById('chat-box');
            var div = document.createElement('div');
            div.className = "bg-slate-700 p-3 rounded-lg max-w-[80%]";
            div.innerHTML = `<span class="text-indigo-400 font-bold text-xs">${message.sender}</span><p class="text-sm">${message.content}</p>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        connect();
    </script>
</body>
</html>
