<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Realtime - Nicolas Gil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 h-screen flex flex-col">

    <header class="bg-indigo-600 p-4 shadow-lg text-white text-center font-bold text-xl">
        SENA Chat Prototipo - Live
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 text-white">
        </main>

    <footer class="p-4 bg-slate-800 flex gap-2">
        <input type="text" id="username" placeholder="Tu nombre" class="w-1/4 p-2 rounded bg-slate-700 border-none text-white outline-none focus:ring-2 focus:ring-indigo-500">
        <input type="text" id="message" placeholder="Escribe un mensaje..." class="flex-1 p-2 rounded bg-slate-700 border-none text-white outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded font-bold transition">Enviar</button>
    </footer>

    <script>
        var stompClient = null;

        function connect() {
            // Conexión relativa para que funcione en Render (HTTPS)
            var socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function (frame) {
                console.log('Conectado: ' + frame);
                stompClient.subscribe('/topic/public', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            }, function(error) {
                console.log("Error de conexión: " + error);
                // Intento de reconexión automática tras 5 segundos
                setTimeout(connect, 5000);
            });
        }

        function sendMessage() {
            var name = document.getElementById('username').value;
            var content = document.getElementById('message').value;

            if (name && content && stompClient) {
                var chatMessage = {
                    sender: name,
                    content: content
                };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                document.getElementById('message').value = '';
            }
        }

        function showMessage(msg) {
            var chatBox = document.getElementById('chat-box');
            var msgDiv = document.createElement('div');
            msgDiv.className = "bg-slate-700 p-3 rounded-lg max-w-md shadow-sm border-l-4 border-indigo-500";
            msgDiv.innerHTML = `<strong class="text-indigo-400">${msg.sender}:</strong> <p class="inline">${msg.content}</p>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Iniciar conexión al cargar la página
        connect();
    </script>
</body>
</html>
